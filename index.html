<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry's Alchemy Restock</title>
<style>
  /* Base Variables - Dark Mode */
  :root {
    --bg: #1A120B;
    --panel: #2C221E;
    --panel2: #211915;
    --border: #5C3D2E;
    --border-bright: #F59E0B;
    --text: #F5F5F4;
    --muted: #A8A29E;
    --accent: #F59E0B;
    --accent2: #D97706;
    --crimson: #DC2626;
    --shadow: rgba(0, 0, 0, 0.8);
  }

  /* Light Mode */
  [data-theme="light"] {
    --bg: #FDFBF7;
    --panel: #FFF;
    --panel2: #E7E5E4;
    --border: #78350F;
    --border-bright: #B45309;
    --text: #1C1917;
    --muted: #57534E;
    --accent: #B45309;
    --accent2: #78350F;
    --crimson: #991B1B;
    --shadow: rgba(28, 25, 23, 0.12);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; font-family: Georgia, "Impact", serif;
    background:var(--bg); color:var(--text); padding:16px 24px 60px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .wrap{ max-width:1350px; margin:0 auto; position: relative; }

  /* Top Control Bar positioned absolutely on wide screens */
  .top-bar {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 10;
  }
  
  .header-row {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    max-width: 900px;
    margin: 0 auto 12px;
    gap: 24px;
  }

  .header-title-container {
    text-align: center;
    flex: 0 1 auto;
  }

  .character-portrait-wrapper {
    position: relative;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 3px solid var(--border-bright);
    background: #3B261A;
    box-shadow: 0 0 12px var(--accent);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .character-portrait-wrapper:hover {
    transform: scale(1.15) rotate(4deg);
    box-shadow: 0 0 20px #FFD700;
  }
  .character-portrait-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  
  /* Fine-tuned facial alignments */
  .portrait-henry { object-position: 50% 15%; }
  .portrait-capon { object-position: 50% 10%; }

  h1{
    text-align:center; font-size:32px; letter-spacing:1.5px; margin:0;
    color:var(--accent); font-variant:small-caps; text-shadow:2px 2px 0px #000, 0 0 12px var(--accent);
  }
  .motto {
    display: block;
    text-align: center;
    font-size: 15px;
    color: var(--crimson);
    letter-spacing: 2.5px;
    font-weight: bold;
    font-style: italic;
    margin-top: 4px;
    text-shadow: 0 0 5px rgba(220, 38, 38, 0.4);
  }

  .theme-toggle {
    background: var(--panel);
    border: 2px solid var(--border-bright);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .theme-toggle:hover {
    background: var(--border-bright);
    color: #000;
    transform: scale(1.05);
  }

  /* Increased breakpoint to 1100px so button drops above the header early */
  @media (max-width: 1100px) {
    .top-bar {
      position: static;
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
  }

  @media (max-width: 650px) {
    .header-row { flex-direction: column; align-items: center; gap: 12px; }
    h1 { font-size: 26px; }
    .motto { font-size: 13px; }
    body { padding: 12px 12px 40px; }
  }

  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; font-style:italic; }

  .toolbar{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;
    align-items:center; margin-bottom:16px; background:var(--panel);
    padding:10px 14px; border:1px solid var(--border); border-radius:6px;
    box-shadow: 0 4px 12px var(--shadow);
  }
  .btn-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:4px; padding:8px 14px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:all 0.2s; text-transform:uppercase; letter-spacing:0.5px;
    font-weight:bold;
  }
  .btn:hover{ background:var(--border-bright); color:#000; border-color:var(--accent); transform: translateY(-2px); }
  .search-input{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:4px; font-family:inherit; font-size:13px; flex-grow:1; max-width:300px;
  }
  .search-input:focus{ outline:none; border-color:var(--accent); box-shadow: 0 0 8px var(--accent); }

  .shopping{
    background:var(--panel); border:2px solid var(--border); border-radius:6px;
    padding:16px 20px; margin-bottom:24px; box-shadow:0 4px 14px var(--shadow);
  }
  .shopping h2{ margin:0 0 10px; font-size:20px; color:var(--accent); font-variant:small-caps; display:flex; justify-content:space-between; align-items:center;}
  .shopping-empty{ color:var(--muted); font-size:14px; font-style:italic; }
  .shop-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:8px 20px; font-size:15px;
  }
  .shop-item{
    display:flex; justify-content:space-between; border-bottom:1px dotted var(--border);
    padding:4px 0; cursor:pointer; user-select:none; transition:opacity 0.2s, color 0.2s;
  }
  .shop-item:hover{ color:var(--accent); }
  .shop-item.checked{ text-decoration:line-through; opacity:0.35; color:var(--muted); }
  .shop-item b{ color:var(--accent2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 10px var(--shadow);
    transition: border-color 0.2s, transform 0.1s, background-color 0.3s ease;
  }
  .card:hover { border-color: var(--border-bright); transform: translateY(-2px); }
  
  .card-head { 
    display: flex; 
    justify-content: space-between; 
    align-items: baseline; 
    height: 24px;
    margin-bottom: 6px;
  }
  .card-head h3 { margin: 0; font-size: 18px; color: var(--accent); font-variant: small-caps; }
  .base { font-size: 11px; color: var(--crimson); font-weight: bold; text-transform: uppercase; letter-spacing: 0.8px; }

  .desc-box { height: 52px; margin-bottom: 12px; }
  .effect { font-size: 13px; color: var(--muted); font-style: italic; margin: 0; line-height: 1.3; }

  .qty-row { 
    display: flex; 
    flex-direction: row; 
    align-items: center; 
    justify-content: space-between; 
    gap: 8px; 
    font-size: 13px; 
    color: var(--muted); 
    width: 100%;
    margin-bottom: 12px;
  }
  .qty-row span { white-space: nowrap; }
  .qty-ctrl { 
    display: flex; 
    align-items: center; 
    border: 1px solid var(--border); 
    border-radius: 4px; 
    overflow: hidden; 
    background: var(--panel2); 
  }
  .qty-btn { background: none; border: none; color: var(--text); padding: 4px 12px; cursor: pointer; font-weight: bold; font-size: 14px;}
  .qty-btn:hover { background: var(--border-bright); color: #000; }
  .qty-row input {
    width: 38px; background: none; border: none; color: var(--text);
    padding: 2px 0; font-family: inherit; text-align: center; -moz-appearance: textfield; font-weight: bold;
  }
  .qty-row input::-webkit-outer-spin-button, .qty-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .ing-list { margin: 0 0 12px 0; padding-left: 18px; font-size: 14px; min-height: 72px; }
  .ing-list li::marker { color: var(--accent2); }
  .toggle {
    background: none; border: 1px solid var(--border); color: var(--accent);
    border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    align-self: flex-start; font-family: inherit; transition: all 0.2s; font-weight: bold; margin-bottom: 8px;
  }
  .toggle:hover { background: var(--panel2); border-color: var(--border-bright); }
  .steps { display: none; margin: 0 0 8px 0; padding-left: 18px; font-size: 13.5px; color: var(--text); }
  .steps.open { display: block; }
  .steps li { margin-bottom: 4px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <button class="theme-toggle" id="themeToggleBtn">☀️ Light Mode</button>
  </div>

  <div class="header-row">
    <!-- Image Portrait: Henry -->
    <div class="character-portrait-wrapper" title="Henry's come to see us!">
      <img src="images/henry.jpg" alt="Henry" class="portrait-henry">
    </div>

    <div class="header-title-container">
      <h1>Henry's Alchemy Restock</h1>
      <span class="motto">⚔️ AUDENTES FORTUNA IUVAT ⚔️</span>
    </div>

    <!-- Image Portrait: Hans Capon -->
    <div class="character-portrait-wrapper" title="Lord Hans Capon of Leipa">
      <img src="images/capon.jpg" alt="Capon" class="portrait-capon">
    </div>
  </div>

  <div class="sub">"Jesus Christ be praised! Stock up on herbs before Lord Capon gets us ambushed by Cumans again."</div>

  <div class="shopping" id="shopping">
    <h2>
      <span>🌾 Herbalist Shopping List</span>
      <button class="btn" id="copyBtn" title="Copy to clipboard">Copy List</button>
    </h2>
    <div id="shopContent"></div>
  </div>

  <div class="toolbar">
    <div class="btn-group">
      <button class="btn" id="resetBtn">Clear All</button>
      <button class="btn" id="setOneBtn">Set All to 1</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search potions or herbs...">
  </div>

  <div class="grid" id="potionGrid"></div>
</div>

<script>
const potions = [
  {
    name: "Fox Potion",
    base: "1 Oil",
    effect: "Improves speech and reading for negotiating or studying alchemy tomes.",
    ingredients: [
      {name:"Nettle", qty:1},
      {name:"St. John's wort", qty:1},
      {name:"Belladonna", qty:1},
      {name:"Charcoal", qty:1}
    ],
    steps: [
      "Grind the St. John's wort and the nettle.",
      "Add both to cauldron and boil for 2 turns.",
      "Grind charcoal and throw it in.",
      "Add belladonna and boil for 1 turn.",
      "Pour into bottle."
    ]
  },
  {
    name: "Aqua Vitalis",
    base: "1 Water",
    effect: "Reduces damage taken so Henry doesn't get one-shot by a peasant with a club.",
    ingredients: [
      {name:"Dandelion", qty:2},
      {name:"Marigold", qty:1}
    ],
    steps: [
      "Add dandelion to cauldron and boil for 1 turn.",
      "Grind marigold and add to cauldron.",
      "Boil for 2 turns.",
      "Finally, distil."
    ]
  },
  {
    name: "Artemisia",
    base: "1 Spiritus",
    effect: "Increases Strength so you can carry 600 lbs of stolen Cuman armor back to Miller Peshek.",
    ingredients: [
      {name:"Wormwood", qty:2},
      {name:"Sage", qty:1}
    ],
    steps: [
      "Add sage to cauldron and boil for 1 turn.",
      "Grind wormwood and add to cauldron.",
      "Boil for 2 turns.",
      "Finally, distil."
    ]
  },
  {
    name: "Marigold Decoction",
    base: "1 Water",
    effect: "Liquid chug-healing. Instantly fixes hangover after a wild night out with Father Godwin.",
    ingredients: [
      {name:"Nettle", qty:1},
      {name:"Marigold", qty:2}
    ],
    steps: [
      "Add nettle to cauldron and boil for 2 turns.",
      "Grind marigold and add to cauldron.",
      "Pour directly down Henry's throat."
    ]
  },
  {
    name: "Quickfinger",
    base: "1 Water",
    effect: "Improves lockpicking so you can pick locks with ease.",
    ingredients: [
      {name:"Eyebright", qty:2},
      {name:"Valerian", qty:2},
      {name:"Cobweb", qty:1}
    ],
    steps: [
      "Add cobweb and eyebright to cauldron; boil for 3 turns.",
      "Grind valerian and add to cauldron.",
      "Boil for 1 turn, then pour."
    ]
  },
  {
    name: "Saviour Schnapps",
    base: "1 Wine",
    effect: "Saves your game! Warning: Drink too many and Henry wakes up naked in a ditch near Talmberg.",
    ingredients: [
      {name:"Nettle", qty:1},
      {name:"Belladonna", qty:2}
    ],
    steps: [
      "Add nettle to cauldron and boil for 2 turns.",
      "Grind belladonna.",
      "Add belladonna to cauldron and boil for 1 turn.",
      "Pour into flask and save your life!"
    ]
  },
  {
    name: "Buck's Blood",
    base: "1 Oil",
    effect: "Infinite stamina mode for sprinting away when 4 heavily armored bandits jump you.",
    ingredients: [
      {name:"St. John's wort", qty:1},
      {name:"Dandelion", qty:1},
      {name:"Comfrey", qty:1}
    ],
    steps: [
      "Grind St. John's wort and add to cauldron.",
      "Add comfrey to cauldron and boil for 1 turn.",
      "Add dandelion and pump bellows for 1 turn.",
      "Pour into bottle."
    ]
  },
  {
    name: "Bane Poison",
    base: "1 Wine",
    effect: "Lethal poison. Slip it into the bandit camp stew pot while nobody is looking.",
    ingredients: [
      {name:"Wormwood", qty:1},
      {name:"Belladonna", qty:2},
      {name:"Amanita muscaria", qty:1}
    ],
    steps: [
      "Add wormwood to cauldron and boil for 2 turns.",
      "Grind belladonna and add to cauldron.",
      "Boil for 1 turn using bellows.",
      "Add fly agaric mushroom.",
      "Distil with extreme caution!"
    ]
  },
  {
    name: "Painkiller",
    base: "1 Spiritus",
    effect: "Numbs pain when Captain Bernard breaks your ribs during combat practice.",
    ingredients: [
      {name:"Poppy", qty:3},
      {name:"Comfrey", qty:1},
      {name:"Marigold", qty:1}
    ],
    steps: [
      "Grind poppy and add to cauldron.",
      "Add marigold and pump bellows for 1 turn.",
      "Add comfrey and boil for 2 turns.",
      "Distil."
    ]
  },
  {
    name: "Hair o' the Dog",
    base: "1 Water",
    effect: "Cures drunkenness when Capon challenges you to a bathhouse drinking contest.",
    ingredients: [
      {name:"Sage", qty:1},
      {name:"St. John's wort", qty:1},
      {name:"Mint", qty:1}
    ],
    steps: [
      "Add sage and St. John's wort to cauldron.",
      "Boil for 3 turns.",
      "Grind mint and throw it in.",
      "Pour and drink immediately."
    ]
  }
];

const grid = document.getElementById('potionGrid');
const savedState = JSON.parse(localStorage.getItem('kcd2_potion_state') || '{}');
const state = {};
const checkedItems = new Set();

const themeToggleBtn = document.getElementById('themeToggleBtn');
const savedTheme = localStorage.getItem('kcd2_theme') || 'dark';

function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggleBtn.textContent = '🌙 Dark Mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggleBtn.textContent = '☀️ Light Mode';
  }
  localStorage.setItem('kcd2_theme', theme);
}

themeToggleBtn.addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

applyTheme(savedTheme);

potions.forEach((p, i) => {
  state[p.name] = savedState[p.name] !== undefined ? savedState[p.name] : 1;
  
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.name = p.name.toLowerCase();
  card.dataset.ingredients = p.ingredients.map(ing => ing.name.toLowerCase()).join(' ');
  
  card.innerHTML = `
    <div class="card-head">
      <h3>${p.name}</h3>
      <span class="base">${p.base}</span>
    </div>

    <div class="desc-box">
      <p class="effect">${p.effect}</p>
    </div>

    <div class="qty-row">
      <span>Brews wanted:</span>
      <div class="qty-ctrl">
        <button class="qty-btn dec" data-name="${p.name}">-</button>
        <input type="number" min="0" max="99" step="1" value="${state[p.name]}" data-name="${p.name}" class="qtyInput" aria-label="Quantity for ${p.name}">
        <button class="qty-btn inc" data-name="${p.name}">+</button>
      </div>
    </div>

    <ul class="ing-list">
      ${p.ingredients.map(ing => `<li data-ing="${ing.name}">${ing.qty} &times; ${ing.name}</li>`).join('')}
    </ul>
    
    <button class="toggle" data-idx="${i}" aria-expanded="false">Show Alchemy Instructions</button>
    <ol class="steps" id="steps-${i}">
      ${p.steps.map(s => `<li>${s}</li>`).join('')}
    </ol>
  `;
  grid.appendChild(card);
});

grid.querySelectorAll('.toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const steps = document.getElementById('steps-' + btn.dataset.idx);
    const open = steps.classList.toggle('open');
    btn.textContent = open ? 'Hide Alchemy Instructions' : 'Show Alchemy Instructions';
    btn.setAttribute('aria-expanded', open);
  });
});

function updateQuantity(name, value) {
  let v = parseInt(value, 10);
  if (isNaN(v) || v < 0) v = 0;
  state[name] = v;
  
  const input = grid.querySelector(`input[data-name="${name}"]`);
  if (input) input.value = v;

  localStorage.setItem('kcd2_potion_state', JSON.stringify(state));
  updateShoppingList();
}

grid.addEventListener('input', e => {
  if (e.target.classList.contains('qtyInput')) {
    updateQuantity(e.target.dataset.name, e.target.value);
  }
});

grid.addEventListener('click', e => {
  if (e.target.classList.contains('inc')) {
    const name = e.target.dataset.name;
    updateQuantity(name, (state[name] || 0) + 1);
  } else if (e.target.classList.contains('dec')) {
    const name = e.target.dataset.name;
    updateQuantity(name, Math.max(0, (state[name] || 0) - 1));
  }
});

function updateShoppingList(){
  const totals = {};
  
  potions.forEach(p => {
    const count = state[p.name] || 0;
    if (count <= 0) return;
    p.ingredients.forEach(ing => {
      totals[ing.name] = (totals[ing.name] || 0) + ing.qty * count;
    });
  });

  const shopContent = document.getElementById('shopContent');
  const names = Object.keys(totals).sort();
  
  if (names.length === 0){
    shopContent.innerHTML = '<div class="shopping-empty">No potions selected yet!</div>';
    return;
  }
  
  let html = '<div class="shop-grid">';
  names.forEach(n => {
    const isChecked = checkedItems.has(n) ? ' checked' : '';
    html += `<div class="shop-item${isChecked}" data-item="${n}"><span>${n}</span><b>${totals[n]}</b></div>`;
  });
  html += '</div>';

  shopContent.innerHTML = html;

  shopContent.querySelectorAll('.shop-item').forEach(item => {
    item.addEventListener('click', () => {
      const name = item.dataset.item;
      if (checkedItems.has(name)) {
        checkedItems.delete(name);
        item.classList.remove('checked');
      } else {
        checkedItems.add(name);
        item.classList.add('checked');
      }
    });
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  const query = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(card => {
    const matches = card.dataset.name.includes(query) || card.dataset.ingredients.includes(query);
    card.style.display = matches ? 'flex' : 'none';
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(state).forEach(k => state[k] = 0);
  grid.querySelectorAll('.qtyInput').forEach(inp => inp.value = 0);
  localStorage.setItem('kcd2_potion_state', JSON.stringify(state));
  updateShoppingList();
});

document.getElementById('setOneBtn').addEventListener('click', () => {
  Object.keys(state).forEach(k => state[k] = 1);
  grid.querySelectorAll('.qtyInput').forEach(inp => inp.value = 1);
  localStorage.setItem('kcd2_potion_state', JSON.stringify(state));
  updateShoppingList();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const totals = {};
  potions.forEach(p => {
    const count = state[p.name] || 0;
    if (count <= 0) return;
    p.ingredients.forEach(ing => {
      totals[ing.name] = (totals[ing.name] || 0) + ing.qty * count;
    });
  });

  const lines = Object.keys(totals).sort().map(k => `${totals[k]}x ${k}`);
  if (lines.length === 0) return;

  navigator.clipboard.writeText("Henry's KCD2 Shopping List:\n" + lines.join("\n")).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy List", 1500);
  });
});

updateShoppingList();
</script>
</body>
</html>
