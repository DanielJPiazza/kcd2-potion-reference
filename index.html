<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry's Alchemy Restock - KCD2</title>
<style>
  /* Base Variables - "Apothecary Ledger" Dark Mode */
  :root {
    --bg: #1C1917;             /* Charcoal Walnut */
    --panel: #292524;          /* Deep Leather / Wood Panel */
    --panel2: #211E1C;         /* Inset Shadow Bark */
    --border: #44403C;          /* Aged Timber Border */
    --border-bright: #D97706;   /* Warm Amber Gold Highlight */
    --text: #F5F5F4;            /* Off-White Parchment Text */
    --muted: #A8A29E;           /* Weathered Slate Grey */
    --accent: #F59E0B;          /* Warm Honey Amber */
    --accent2: #D97706;         /* Ochre Gold */
    --crimson: #DC2626;         /* Bohemian Red */
    --shadow: rgba(0, 0, 0, 0.6);
  }

  /* "Bohemian Parchment" Light Mode */
  [data-theme="light"] {
    --bg: #F5F5F4;             /* Warm Sunlit Vellum */
    --panel: #FFFFFF;          /* Pure Parchment */
    --panel2: #E7E5E4;         /* Soft Tan Inset */
    --border: #78350F;          /* Burnished Leather Border */
    --border-bright: #B45309;   /* Warm Amber Highlight */
    --text: #1C1917;            /* Dark Iron Ink */
    --muted: #57534E;           /* Aged Ink Grey */
    --accent: #B45309;          /* Deep Amber Gold */
    --accent2: #78350F;         /* Rich Mahogany */
    --crimson: #991B1B;         /* Bohemian Red */
    --shadow: rgba(28, 25, 23, 0.08);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia, 'Times New Roman', serif;
    background:var(--bg); color:var(--text); padding:24px 16px 80px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  
  .header-row {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    max-width: 900px;
    margin: 0 auto 4px;
  }
  h1{
    text-align:center; font-size:28px; letter-spacing:1.5px; margin:0;
    color:var(--accent); font-variant:small-caps; text-shadow:0 2px 8px var(--shadow);
  }
  .theme-toggle {
    position: absolute;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
  }
  .theme-toggle:hover {
    border-color: var(--border-bright);
    color: var(--accent);
  }

  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; font-style:italic; }
  .wrap{ max-width:900px; margin:0 auto; }

  /* Toolbar */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;
    align-items:center; margin-bottom:16px; background:var(--panel);
    padding:10px 14px; border:1px solid var(--border); border-radius:6px;
    box-shadow: 0 4px 12px var(--shadow);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .btn-group{ display:flex; gap:6px; flex-wrap:wrap; }
  .btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:4px; padding:6px 12px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:all 0.2s; text-transform:uppercase; letter-spacing:0.5px;
    font-weight:bold;
  }
  .btn:hover{ background:var(--border); color:var(--accent); border-color:var(--border-bright); }
  .search-input{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:4px; font-family:inherit; font-size:13px; flex-grow:1; max-width:240px;
  }
  .search-input:focus{ outline:none; border-color:var(--accent); }

  /* Shopping Section */
  .shopping{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:16px 20px; margin-bottom:24px; box-shadow:0 4px 14px var(--shadow);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .shopping h2{ margin:0 0 10px; font-size:19px; color:var(--accent); font-variant:small-caps; display:flex; justify-content:space-between; align-items:center;}
  .shopping-empty{ color:var(--muted); font-size:14px; font-style:italic; }
  .shop-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:8px 16px; font-size:15px;
  }
  .shop-item{
    display:flex; justify-content:space-between; border-bottom:1px dotted var(--border);
    padding:4px 0; cursor:pointer; user-select:none; transition:opacity 0.2s, color 0.2s;
  }
  .shop-item:hover{ color:var(--accent); }
  .shop-item.checked{ text-decoration:line-through; opacity:0.35; color:var(--muted); }
  .shop-item b{ color:var(--accent2); }
  .base-list{ margin-top:12px; font-size:13px; color:var(--muted); border-top:1px dashed var(--border); padding-top:8px; }

  /* Grid & Cards */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 10px var(--shadow);
    transition: border-color 0.2s, transform 0.1s, background-color 0.3s ease;
  }
  .card:hover { border-color: var(--border-bright); }
  
  .card-head { 
    display: flex; 
    justify-content: space-between; 
    align-items: baseline; 
    height: 24px;
    margin-bottom: 6px;
  }
  .card-head h3 { margin: 0; font-size: 18px; color: var(--accent); font-variant: small-caps; }
  .base { font-size: 11px; color: var(--crimson); font-weight: bold; text-transform: uppercase; letter-spacing: 0.8px; }

  /* Fixed height block locks vertical alignment across cards */
  .desc-box {
    height: 52px;
    margin-bottom: 12px;
  }
  .effect { font-size: 13px; color: var(--muted); font-style: italic; margin: 0; line-height: 1.3; }

  /* Horizontal Alignment for Brews Wanted Row */
  .qty-row { 
    display: flex; 
    flex-direction: row; 
    align-items: center; 
    justify-content: space-between; 
    gap: 8px; 
    font-size: 13px; 
    color: var(--muted); 
    width: 100%;
    margin-bottom: 12px;
  }
  .qty-row span { white-space: nowrap; }
  .qty-ctrl { 
    display: flex; 
    align-items: center; 
    border: 1px solid var(--border); 
    border-radius: 4px; 
    overflow: hidden; 
    background: var(--panel2); 
  }
  .qty-btn { background: none; border: none; color: var(--text); padding: 3px 10px; cursor: pointer; font-weight: bold; }
  .qty-btn:hover { background: var(--border); color: var(--accent); }
  .qty-row input {
    width: 36px; background: none; border: none; color: var(--text);
    padding: 2px 0; font-family: inherit; text-align: center; -moz-appearance: textfield; font-weight: bold;
  }
  .qty-row input::-webkit-outer-spin-button, .qty-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .ing-list { margin: 0 0 12px 0; padding-left: 18px; font-size: 14px; min-height: 72px; }
  .ing-list li::marker { color: var(--accent2); }
  .toggle {
    background: none; border: 1px solid var(--border); color: var(--accent);
    border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    align-self: flex-start; font-family: inherit; transition: all 0.2s; font-weight: bold; margin-bottom: 8px;
  }
  .toggle:hover { background: var(--panel2); border-color: var(--border-bright); }
  .steps { display: none; margin: 0 0 8px 0; padding-left: 18px; font-size: 13.5px; color: var(--text); }
  .steps.open { display: block; }
  .steps li { margin-bottom: 4px; }
  .quality-note { font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 6px; margin-top: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <h1>Henry's Alchemy Restock</h1>
    <button class="theme-toggle" id="themeToggleBtn">☀️ Light</button>
  </div>
  <div class="sub">Set how many of each potion you want to brew — the shopping list below updates automatically.</div>

  <div class="shopping" id="shopping">
    <h2>
      <span>Shopping list</span>
      <button class="btn" id="copyBtn" title="Copy to clipboard">Copy List</button>
    </h2>
    <div id="shopContent"></div>
  </div>

  <div class="toolbar">
    <div class="btn-group">
      <button class="btn" id="resetBtn">Reset All to 0</button>
      <button class="btn" id="setOneBtn">Set All to 1</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search potions or herbs...">
  </div>

  <div class="grid" id="potionGrid"></div>
</div>

<script>
const potions = [
  {
    name: "Fox",
    base: "1 Oil",
    effect: "Improves speech and speeds up reading (good quality). Boosts XP gain at best quality.",
    ingredients: [
      {name:"Nettle", qty:1},
      {name:"St. John's wort", qty:1},
      {name:"Belladonna", qty:1},
      {name:"Charcoal", qty:1}
    ],
    steps: [
      "Grind the St. John's wort and the nettle.",
      "Add both to the cauldron and boil for 2 turns.",
      "Grind the charcoal and add it to the cauldron.",
      "Add the belladonna and boil for 1 turn.",
      "Finally, pour."
    ]
  },
  {
    name: "Aqua Vitalis",
    base: "1 Water",
    effect: "Reduces loss of health and slows bleeding.",
    ingredients: [
      {name:"Dandelion", qty:2},
      {name:"Marigold", qty:1}
    ],
    steps: [
      "Add the dandelion to the cauldron and boil for 1 turn.",
      "Grind the marigold and add it to the cauldron.",
      "Boil for 2 turns.",
      "Finally, distil."
    ]
  },
  {
    name: "Artemisia",
    base: "1 Spiritus",
    effect: "Increases Strength for 10 minutes.",
    ingredients: [
      {name:"Wormwood", qty:2},
      {name:"Sage", qty:1}
    ],
    steps: [
      "Add the sage to the cauldron and boil for 1 turn.",
      "Grind the wormwood and add it to the cauldron.",
      "Boil for 2 turns.",
      "Finally, distil."
    ]
  },
  {
    name: "Marigold Decoction",
    base: "1 Water",
    effect: "Gradually heals part of your health. Helps against hangover, cures it outright at good quality.",
    ingredients: [
      {name:"Nettle", qty:1},
      {name:"Marigold", qty:2}
    ],
    steps: [
      "Add the nettle to the cauldron and boil for 2 turns.",
      "Grind the marigold and add it to the cauldron.",
      "Finally, pour."
    ]
  },
  {
    name: "Quickfinger",
    base: "1 Water",
    effect: "Increases thievery and craftsmanship skills.",
    ingredients: [
      {name:"Eyebright", qty:2},
      {name:"Valerian", qty:2},
      {name:"Cobweb", qty:1}
    ],
    steps: [
      "Add the cobweb and the eyebright to the cauldron and boil for 3 turns.",
      "Grind the valerian and add it to the cauldron.",
      "Boil for 1 turn.",
      "Finally, pour."
    ]
  },
  {
    name: "Saviour Schnapps",
    base: "1 Wine",
    effect: "Manually saves the game. Good quality also boosts strength, vitality and agility.",
    ingredients: [
      {name:"Nettle", qty:1},
      {name:"Belladonna", qty:2}
    ],
    steps: [
      "Add the nettle to the cauldron and boil for 2 turns.",
      "Grind the belladonna.",
      "Add the belladonna to the cauldron and boil for 1 turn.",
      "Finally, pour."
    ]
  },
  {
    name: "Buck's Blood",
    base: "1 Oil",
    effect: "Increases stamina, and stamina regeneration at good quality.",
    ingredients: [
      {name:"St. John's wort", qty:1},
      {name:"Dandelion", qty:1},
      {name:"Comfrey", qty:1}
    ],
    steps: [
      "Grind the St. John's wort and add it to the cauldron.",
      "Add the comfrey to the cauldron and boil for 1 turn.",
      "Add the dandelion and, using the bellows, boil for 1 turn.",
      "Finally, pour."
    ]
  },
  {
    name: "Bane (poison)",
    base: "1 Wine",
    effect: "Deadly poison — reduces health by 110. Better suited to poisoning cooking pots than weapons.",
    ingredients: [
      {name:"Wormwood", qty:1},
      {name:"Belladonna", qty:2},
      {name:"Amanita muscaria (fly agaric)", qty:1}
    ],
    steps: [
      "Add the wormwood to the cauldron and boil for 2 turns.",
      "Grind the belladonna and add it to the cauldron.",
      "Boil for 1 turn using the bellows.",
      "Add the fly agaric to the cauldron.",
      "Finally, distil."
    ]
  },
  {
    name: "Painkiller",
    base: "1 Spiritus",
    effect: "Lessens the effect of wounds and reduces stamina loss tied to low health.",
    ingredients: [
      {name:"Poppy", qty:3},
      {name:"Comfrey", qty:1},
      {name:"Marigold", qty:1}
    ],
    steps: [
      "Grind the poppy and add it to the cauldron.",
      "Add the marigold and, using the bellows, boil for 1 turn.",
      "Add the comfrey and boil for 2 turns.",
      "Finally, distil."
    ]
  },
  {
    name: "Hair o' the Dog",
    base: "1 Water",
    effect: "Reduces drunkenness — full sobriety at good quality, also helps hangovers.",
    ingredients: [
      {name:"Sage", qty:1},
      {name:"St. John's wort", qty:1},
      {name:"Mint", qty:1}
    ],
    steps: [
      "Add the sage and St. John's wort to the cauldron.",
      "Boil for 3 turns.",
      "Grind the mint and add it to the cauldron.",
      "Finally, pour."
    ]
  }
];

const grid = document.getElementById('potionGrid');
const savedState = JSON.parse(localStorage.getItem('kcd2_potion_state') || '{}');
const state = {};
const checkedItems = new Set();

// Theme Toggle Logic
const themeToggleBtn = document.getElementById('themeToggleBtn');
const savedTheme = localStorage.getItem('kcd2_theme') || 'dark';

function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggleBtn.textContent = '🌙 Dark';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggleBtn.textContent = '☀️ Light';
  }
  localStorage.setItem('kcd2_theme', theme);
}

themeToggleBtn.addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

applyTheme(savedTheme);

// Render Cards
potions.forEach((p, i) => {
  state[p.name] = savedState[p.name] !== undefined ? savedState[p.name] : 1;
  
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.name = p.name.toLowerCase();
  card.dataset.ingredients = p.ingredients.map(ing => ing.name.toLowerCase()).join(' ');
  
  card.innerHTML = `
    <div class="card-head">
      <h3>${p.name}</h3>
      <span class="base">${p.base}</span>
    </div>

    <div class="desc-box">
      <p class="effect">${p.effect}</p>
    </div>

    <div class="qty-row">
      <span>Brews wanted:</span>
      <div class="qty-ctrl">
        <button class="qty-btn dec" data-name="${p.name}">-</button>
        <input type="number" min="0" max="99" step="1" value="${state[p.name]}" data-name="${p.name}" class="qtyInput" aria-label="Quantity for ${p.name}">
        <button class="qty-btn inc" data-name="${p.name}">+</button>
      </div>
    </div>

    <ul class="ing-list">
      ${p.ingredients.map(ing => `<li data-ing="${ing.name}">${ing.qty} &times; ${ing.name}</li>`).join('')}
    </ul>
    
    <button class="toggle" data-idx="${i}" aria-expanded="false">Show brewing steps</button>
    <ol class="steps" id="steps-${i}">
      ${p.steps.map(s => `<li>${s}</li>`).join('')}
    </ol>
    <div class="quality-note">Quality depends on ingredient freshness and precise timing. Mistakes lower quality; incorrect ingredients fail the brew.</div>
  `;
  grid.appendChild(card);
});

// Event Listeners for Cards
grid.querySelectorAll('.toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const steps = document.getElementById('steps-' + btn.dataset.idx);
    const open = steps.classList.toggle('open');
    btn.textContent = open ? 'Hide brewing steps' : 'Show brewing steps';
    btn.setAttribute('aria-expanded', open);
  });
});

function updateQuantity(name, value) {
  let v = parseInt(value, 10);
  if (isNaN(v) || v < 0) v = 0;
  state[name] = v;
  
  const input = grid.querySelector(`input[data-name="${name}"]`);
  if (input) input.value = v;
  
  localStorage.setItem('kcd2_potion_state', JSON.stringify(state));
  updateShoppingList();
}

grid.addEventListener('input', e => {
  if (e.target.classList.contains('qtyInput')) {
    updateQuantity(e.target.dataset.name, e.target.value);
  }
});

grid.addEventListener('click', e => {
  if (e.target.classList.contains('inc')) {
    const name = e.target.dataset.name;
    updateQuantity(name, (state[name] || 0) + 1);
  } else if (e.target.classList.contains('dec')) {
    const name = e.target.dataset.name;
    updateQuantity(name, Math.max(0, (state[name] || 0) - 1));
  }
});

// Shopping List Logic
function updateShoppingList(){
  const totals = {};
  const baseTotals = {};
  
  potions.forEach(p => {
    const count = state[p.name] || 0;
    if (count <= 0) return;
    baseTotals[p.base] = (baseTotals[p.base] || 0) + count;
    p.ingredients.forEach(ing => {
      totals[ing.name] = (totals[ing.name] || 0) + ing.qty * count;
    });
  });

  const shopContent = document.getElementById('shopContent');
  const names = Object.keys(totals).sort();
  
  if (names.length === 0){
    shopContent.innerHTML = '<div class="shopping-empty">Set brew counts above zero to build your list.</div>';
    return;
  }
  
  let html = '<div class="shop-grid">';
  names.forEach(n => {
    const isChecked = checkedItems.has(n) ? ' checked' : '';
    html += `<div class="shop-item${isChecked}" data-item="${n}"><span>${n}</span><b>${totals[n]}</b></div>`;
  });
  html += '</div>';

  const baseNames = Object.keys(baseTotals).sort();
  if (baseNames.length){
    html += '<div class="base-list">Base liquids needed: ' +
      baseNames.map(b => `${baseTotals[b]} ${b.replace(/^1 /, '')}${baseTotals[b] !== 1 ? 's' : ''} worth (1 per brew)`).join(', ') +
      '</div>';
  }
  shopContent.innerHTML = html;

  // Re-attach checklist click events
  shopContent.querySelectorAll('.shop-item').forEach(item => {
    item.addEventListener('click', () => {
      const name = item.dataset.item;
      if (checkedItems.has(name)) {
        checkedItems.delete(name);
        item.classList.remove('checked');
      } else {
        checkedItems.add(name);
        item.classList.add('checked');
      }
    });
  });
}

// Search & Filter
document.getElementById('searchInput').addEventListener('input', e => {
  const query = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(card => {
    const matches = card.dataset.name.includes(query) || card.dataset.ingredients.includes(query);
    card.style.display = matches ? 'flex' : 'none';
  });
});

// Global Quick Action Toolbar Buttons
document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(state).forEach(k => state[k] = 0);
  grid.querySelectorAll('.qtyInput').forEach(inp => inp.value = 0);
  localStorage.setItem('kcd2_potion_state', JSON.stringify(state));
  updateShoppingList();
});

document.getElementById('setOneBtn').addEventListener('click', () => {
  Object.keys(state).forEach(k => state[k] = 1);
  grid.querySelectorAll('.qtyInput').forEach(inp => inp.value = 1);
  localStorage.setItem('kcd2_potion_state', JSON.stringify(state));
  updateShoppingList();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const totals = {};
  potions.forEach(p => {
    const count = state[p.name] || 0;
    if (count <= 0) return;
    p.ingredients.forEach(ing => {
      totals[ing.name] = (totals[ing.name] || 0) + ing.qty * count;
    });
  });

  const lines = Object.keys(totals).sort().map(k => `${totals[k]}x ${k}`);
  if (lines.length === 0) return;

  navigator.clipboard.writeText("KCD2 Alchemy Restock List:\n" + lines.join("\n")).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy List", 1500);
  });
});

// Initial Render
updateShoppingList();
</script>
</body>
</html>
